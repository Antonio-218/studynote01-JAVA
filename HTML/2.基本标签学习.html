<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>基本标签学习</title>
</head>
<body>

<!-- 标题标签 -->
<h1>一级标签</h1>
<h2>二级标签</h2>
<h3>三级标签</h3>
<h4>四级标签</h4>
<h5>五级标签</h5>
<h6>六级标签</h6>

<!-- 段落标签 -->
<P>两只老虎    两只老虎</P>

<P>跑得快       跑得快</P>

<P>一只没有耳朵    一只没有尾巴</P>

<P>真奇怪      真奇怪</P>

<P>两只老虎     两只老虎</P>

<P>跑得快       跑得快</P>

<P>一只没有耳朵    一只没有尾巴</P>

<P>真奇怪      真奇怪</P>

<!-- 水平线标签 -->
<hr>
<hr/>

<!-- 换行标签 -->
两只老虎    两只老虎 <br/>

跑得快       跑得快 <br/>

一只没有耳朵    一只没有尾巴 <br/>

真奇怪      真奇怪 <br/>

两只老虎     两只老虎 <br/>

跑得快       跑得快 <br/>

一只没有耳朵    一只没有尾巴 <br/>

真奇怪      真奇怪 <br/>

<!-- 粗体，斜体 -->
<h1>字体样式标签</h1>
粗体:  <strong>I LOVE YOU </strong>
斜体:  <em>I LOVE YOU </em>

<br/>

<!-- 特殊符号 -->
空  格
空&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;格
<br/>大于号&gt;
<br/>小于号&lt;
<br/>版权符号&copy;

<!--
特殊符号记忆方式
&   ;
查百度
-->

</body>
</html>
